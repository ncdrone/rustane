# configs/kimi-k2.toml
# Source: moonshotai/Kimi-K2-Instruct config.json (verified 2026-03-23)

[model]
name = "Kimi-K2"
vocab_size = 163840
hidden_size = 7168
num_layers = 61
max_position_embeddings = 163840
bos_token_id = 163584
eos_token_id = 163585
rms_norm_eps = 1e-6
tie_word_embeddings = false

[attention]
kind = "mla"
num_q_heads = 64
num_kv_heads = 64
head_dim = 128
rope_theta = 10000.0
kv_lora_rank = 512
qk_nope_head_dim = 128
qk_rope_head_dim = 64
v_head_dim = 128
q_lora_rank = 1536

[attention.rope_scaling]
factor = 40.0
original_max_position_embeddings = 4096
beta_fast = 32.0
beta_slow = 1.0
mscale = 1.0
mscale_all_dim = 1.0

[ffn]
all_moe = false
first_k_dense_replace = 1
dense_inter_size = 18432
moe_inter_size = 2048
num_experts = 384
num_experts_per_tok = 8
shared_expert_count = 1
norm_topk_prob = true
scoring_func = "sigmoid"
routed_scaling_factor = 2.827
n_group = 1
topk_group = 1

[quantization]
bits = 4
group_size = 128

# Qwen3-MoE-30B-A3B — validation model for rustane MoE inference
# ~30B total params, ~3B active per token
# Source: https://huggingface.co/Qwen/Qwen3-30B-A3B

[model]
name = "Qwen3-MoE-30B-A3B"
architecture = "qwen3_moe"

hidden_size = 2048
intermediate_size = 6144          # dense FFN intermediate dim
num_hidden_layers = 48
num_attention_heads = 32
num_key_value_heads = 4
head_dim = 128
vocab_size = 151936
max_position_embeddings = 40960
rms_norm_eps = 1e-6
rope_theta = 1000000.0
tie_word_embeddings = false

[moe]
num_experts = 128
num_experts_per_tok = 8
decoder_sparse_step = 1          # all layers are MoE
moe_intermediate_size = 768      # per-expert FFN intermediate dim
norm_topk_prob = true

[quantization]
bits = 4
group_size = 128

# configs/qwen3-moe-30b.toml
# Source: Qwen/Qwen3-30B-A3B config.json (verified 2026-03-20)

[model]
name = "Qwen3-MoE-30B-A3B"
vocab_size = 151936
hidden_size = 2048
num_layers = 48
max_position_embeddings = 40960
bos_token_id = 151643
eos_token_id = 151645
rms_norm_eps = 1e-6
tie_word_embeddings = false

[attention]
kind = "gqa"
num_q_heads = 32
num_kv_heads = 4
head_dim = 128
rope_theta = 1000000.0

[ffn]
# ALL 48 layers are MoE (decoder_sparse_step=1, mlp_only_layers=[])
# No dense-only layer, no shared experts in this model
all_moe = true
moe_inter_size = 768
num_experts = 128
num_experts_per_tok = 8
shared_expert_count = 0
norm_topk_prob = true

[quantization]
bits = 4
group_size = 128
